# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# Runs Snyk Code (SAST) on the repository and uploads the results to GitHub
# Code Scanning.
#
# Snyk's other scans don't apply here or live elsewhere:
#   - Snyk Open Source: the repo has no dependency manifests to scan.
#   - Snyk IaC: the repo has no Terraform, CloudFormation, Kubernetes, ARM
#     or Helm files.
#   - Snyk Container: snyk-container.yml tests and monitors both variants.
#
# Requires a SNYK_TOKEN repository secret (https://github.com/snyk/actions#getting-your-snyk-token).
# Without it (PRs from forks, Dependabot PRs) the scan is skipped instead of failing.
#
# For more examples, see https://github.com/snyk/actions/

name: Snyk Security

on:
  push:
    branches: ["main" ]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  snyk:
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
    runs-on: ubuntu-latest
    # Job-level, so every step that runs the snyk CLI is authenticated
    # (the template set it only on the setup step: SNYK-0005 auth errors).
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - name: Skip if SNYK_TOKEN is not set
        if: env.SNYK_TOKEN == ''
        run: echo "::notice title=Snyk Security skipped::SNYK_TOKEN secret is not set; add it under Settings > Secrets and variables > Actions to enable this scan."

      - uses: actions/checkout@v7
        if: env.SNYK_TOKEN != ''
        with:
          persist-credentials: false

      - name: Set up Snyk CLI
        if: env.SNYK_TOKEN != ''
        uses: snyk/actions/setup@11b673cfb4b0dc0d860a1323caa199d54950dcce

        # Snyk Code (SAST). Findings go to Code Scanning instead of failing the build.
      - name: Snyk Code test
        if: env.SNYK_TOKEN != ''
        continue-on-error: true
        run: snyk code test --sarif-file-output=snyk-code.sarif

      - name: Upload result to GitHub Code Scanning
        if: env.SNYK_TOKEN != '' && hashFiles('snyk-code.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: snyk-code.sarif
          category: snyk-code
