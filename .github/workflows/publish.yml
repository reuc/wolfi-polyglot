# Build, test and publish the toolchain images to Docker Hub.
#
# Publishes docker.io/<DOCKER_USER>/wolfi-polyglot (linux/amd64 + linux/arm64),
# shell and distroless variants, from main, only after the smoke test and the
# grype CVE gate pass on the exact image that gets pushed. Each architecture
# image gets an SBOM attestation and a cosign signature; each multi-arch index
# gets a cosign signature and SLSA build provenance.
#
# Tags (the distroless variant adds a -distroless suffix to every tag):
#   shell:       latest,            YYYYMMDD,            sha-<short commit>
#   distroless:  latest-distroless, YYYYMMDD-distroless, sha-<short commit>-distroless
# Pin by digest.
#
# Repository settings needed:
#   DOCKER_USER   Docker Hub user/namespace (a variable or a secret)
#   DOCKER_TOKEN  Docker Hub access token with Read & Write scope (secret)
name: publish

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "Dockerfile.distroless"
      - "tests/smoke.py"
      - "Makefile"
      - ".dockerignore"
      - ".github/workflows/publish.yml"
  schedule:
    # Daily, after build-and-scan (06:17), so new Wolfi fixes are published.
    - cron: "41 7 * * *"
  workflow_dispatch:
  # Dry run on PRs that change this workflow: gates only, no login or push.
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/publish.yml"

permissions:
  contents: read

concurrency:
  # Never cancel a publish midway.
  group: publish
  cancel-in-progress: false

env:
  IMAGE: wolfi-polyglot
  DOCKER_NS: ${{ vars.DOCKER_USER || secrets.DOCKER_USER }}
  PUBLISH: ${{ github.event_name != 'pull_request' }}

jobs:
  gate:
    name: gate (${{ matrix.variant }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write # keyless cosign signing
      attestations: write # SBOM attestation
    strategy:
      fail-fast: true
      matrix:
        variant: [shell, distroless]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      TAG: ci-${{ github.run_id }}
      PLATFORM: linux/${{ matrix.arch }}
      ARCH: ${{ matrix.arch }}
      VARIANT: ${{ matrix.variant }}
      SUFFIX: ${{ matrix.variant == 'distroless' && '-distroless' || '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Source commit
        id: src
        run: echo "short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install grype
        id: grype
        uses: anchore/scan-action/download-grype@v7

      - name: Build
        # NO_CACHE so every build resolves the latest Wolfi packages.
        run: .github/scripts/run-annotated.sh "Build ${VARIANT}/${ARCH}" make "build-${VARIANT}" NO_CACHE=1

      - name: Verify image architecture
        run: |
          ref=$(make -s "image-ref-${VARIANT}")
          got=$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$ref")
          echo "$ref is $got"
          [ "$got" = "linux/${ARCH}" ]

      - name: Smoke test
        run: .github/scripts/run-annotated.sh "Smoke test ${VARIANT}/${ARCH}" make "test-${VARIANT}"

      - name: CVE gate
        env:
          GRYPE: ${{ steps.grype.outputs.cmd }}
        run: .github/scripts/run-annotated.sh "CVE gate ${VARIANT}/${ARCH}" make "scan-${VARIANT}" GRYPE="$GRYPE"

      - name: Upload grype report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: grype-polyglot-${{ matrix.variant }}-${{ matrix.arch }}
          path: reports/
          if-no-files-found: ignore
          retention-days: 30

      # ---- publish the tested per-architecture image (not on pull requests)

      - name: Check Docker Hub settings
        if: env.PUBLISH == 'true'
        env:
          HAS_TOKEN: ${{ secrets.DOCKER_TOKEN != '' }}
        run: |
          [ -n "$DOCKER_NS" ] || { echo "::error::Set DOCKER_USER (repository variable or secret)"; exit 1; }
          [ "$HAS_TOKEN" = true ] || { echo "::error::Set the DOCKER_TOKEN secret (Docker Hub access token, Read & Write)"; exit 1; }

      - name: Log in to Docker Hub
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKER_NS }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Push ${{ matrix.variant }}/${{ matrix.arch }} image
        id: push
        if: env.PUBLISH == 'true'
        env:
          SHORT: ${{ steps.src.outputs.short }}
        run: |
          local_ref=$(make -s "image-ref-${VARIANT}")
          remote="docker.io/${DOCKER_NS}/${IMAGE}:sha-${SHORT}${SUFFIX}-${ARCH}"
          docker tag "$local_ref" "$remote"
          docker push "$remote" | tee push.log
          digest=$(grep -o 'digest: sha256:[0-9a-f]*' push.log | head -1 | cut -d' ' -f2)
          [ -n "$digest" ] || { echo "::error::could not read the pushed digest"; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "local_ref=$local_ref" >> "$GITHUB_OUTPUT"

      - name: Generate SBOM
        if: env.PUBLISH == 'true'
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.push.outputs.local_ref }}
          format: spdx-json
          output-file: sbom-${{ matrix.variant }}-${{ matrix.arch }}.spdx.json
          upload-artifact: false

      - name: Attest SBOM
        if: env.PUBLISH == 'true'
        uses: actions/attest@v4
        with:
          subject-name: index.docker.io/${{ env.DOCKER_NS }}/${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: sbom-${{ matrix.variant }}-${{ matrix.arch }}.spdx.json
          push-to-registry: true

      - name: Install cosign
        if: env.PUBLISH == 'true'
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.2 (no floating major tag)

      - name: Sign ${{ matrix.variant }}/${{ matrix.arch }} image
        if: env.PUBLISH == 'true'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "docker.io/${DOCKER_NS}/${IMAGE}@${DIGEST}"

  publish:
    name: publish multi-arch image (${{ matrix.variant }})
    needs: gate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # keyless cosign signing
      attestations: write # build provenance
    strategy:
      fail-fast: false
      matrix:
        variant: [shell, distroless]
    env:
      SUFFIX: ${{ matrix.variant == 'distroless' && '-distroless' || '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Tags
        id: tags
        run: |
          {
            echo "short=$(git rev-parse --short=7 HEAD)"
            echo "date=$(date -u +%Y%m%d)"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKER_NS }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Create multi-arch image
        id: index
        env:
          SHORT: ${{ steps.tags.outputs.short }}
          DATE: ${{ steps.tags.outputs.date }}
        run: |
          repo="docker.io/${DOCKER_NS}/${IMAGE}"
          docker buildx imagetools create \
            -t "$repo:latest${SUFFIX}" -t "$repo:${DATE}${SUFFIX}" -t "$repo:sha-${SHORT}${SUFFIX}" \
            "$repo:sha-${SHORT}${SUFFIX}-amd64" "$repo:sha-${SHORT}${SUFFIX}-arm64"
          digest=$(docker buildx imagetools inspect "$repo:sha-${SHORT}${SUFFIX}" --format '{{json .Manifest}}' | jq -r .digest)
          [ -n "$digest" ] && [ "$digest" != null ] || { echo "::error::could not read the index digest"; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          docker buildx imagetools inspect "$repo:sha-${SHORT}${SUFFIX}"

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.2 (no floating major tag)

      - name: Sign multi-arch image
        env:
          DIGEST: ${{ steps.index.outputs.digest }}
        run: cosign sign --yes "docker.io/${DOCKER_NS}/${IMAGE}@${DIGEST}"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: index.docker.io/${{ env.DOCKER_NS }}/${{ env.IMAGE }}
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true

      - name: Summary
        env:
          DIGEST: ${{ steps.index.outputs.digest }}
          SHORT: ${{ steps.tags.outputs.short }}
          DATE: ${{ steps.tags.outputs.date }}
          VARIANT: ${{ matrix.variant }}
          REPO_SLUG: ${{ github.repository }}
        run: |
          repo="docker.io/${DOCKER_NS}/${IMAGE}"
          {
            echo "### Published ${repo} (${VARIANT})"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Digest | \`${DIGEST}\` |"
            echo "| Tags | \`latest${SUFFIX}\`, \`${DATE}${SUFFIX}\`, \`sha-${SHORT}${SUFFIX}\` |"
            echo "| Platforms | linux/amd64, linux/arm64 |"
            echo "| Source | ${REPO_SLUG}@${SHORT} |"
            echo
            echo "Pull by digest: \`docker pull ${repo}@${DIGEST}\`"
            echo
            echo "Verify:"
            echo '```'
            echo "cosign verify ${repo}@${DIGEST} \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com \\"
            echo "  --certificate-identity-regexp '^https://github.com/${REPO_SLUG}/\\.github/workflows/publish\\.yml@'"
            echo "gh attestation verify oci://${repo}@${DIGEST} -R ${REPO_SLUG}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
